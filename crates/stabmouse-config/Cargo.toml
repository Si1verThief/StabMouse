[package]
name = "stabmouse-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Config schema, device cascade, and format-preserving IO for StabMouse."

[dependencies]
serde.workspace = true
# The assembler turns a preset into a runnable pipeline, so it must know the stages.
stabmouse-core = { path = "../stabmouse-core" }
thiserror.workspace = true
toml.workspace = true
# The round-trip guarantee (comments, key order and whitespace all survive a write)
# is not achievable with serde alone. See D15.
toml_edit.workspace = true
