[package]
name = "stabmouse-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Desktop integration: what the daemon needs to know about screens, and how it asks the
# compositor to put a tablet on one. Kept out of the other crates so their dependency
# footprint stays small — nothing else needs Wayland or D-Bus.

[dependencies]
thiserror.workspace = true
wayland-client.workspace = true
zbus.workspace = true
