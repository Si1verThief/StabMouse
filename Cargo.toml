[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Si1verThief/StabMouse"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
wayland-client = "0.31"
zbus = "5"
